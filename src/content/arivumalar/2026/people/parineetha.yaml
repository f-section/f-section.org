slug: parineetha
name:
  ta: பரிணீதா
  en: Parineetha
printed_name: பரிணீதா
order: 9
city: மதுரை
fields:
- label: பணி
  value: முன்பு ஒரு நிறுவனத்தில் ப்ராஜெக்ட் ஹெட்டாகவும், பின்னர் கணவரின் போக்குவரத்து வணிகத்திலும் ஈடுபட்டிருந்தேன்.
    தற்போது ‘Pari’s Curry’s’ என்ற கிளவுட் கிச்சன் (Cloud Kitchen) நடத்தி வருகிறேன்.
- label: பொழுதுபோக்கு
  value: புத்தகங்கள் வாசிப்பது, பேட்மிண்டன் விளையாடுவது மற்றும் திரைப்படங்கள் பார்ப்பது.
- label: இணையர்
  value: சோனி ஜோசப், தொழிலதிபர்
- label: திருமண நாள்
  value: 01.02.1998
- label: பிள்ளைகள்
  value: 'ரிச்சி சோனி (27 வயது) — B.E. மற்றும் MBA முடித்து இ-காமர்ஸ் ஸ்டார்ட்அப் நிறுவனத்தில் பணிபுரிகிறார்.

    ரிக்கி சோனி (24 வயது) — BBA முடித்து தந்தையுடன் இணைந்து வணிகம் செய்து வருகிறார்.'
- label: தன்னார்வப் பணி
  value: ‘Ozark Foundation’ மூலம், ‘தினமும் ஒரு வேளை உணவு — யாரும் பசியுடன் உறங்கக் கூடாது’ என்ற நோக்கத்துடன்
    தெருக்களில் இருப்பவர்களுக்கு உணவளித்து வருகிறேன்.
panels:
- label: முப்பது ஆண்டுச் சாதனை
  value: பெரிய விருதுகள் இல்லாவிட்டாலும், சிலருடைய வாழ்க்கையையாவது சற்றேனும் சிறப்பாக்கியுள்ளேன் என நம்புகிறேன்.
    மற்றவர்கள் வாழ்க்கையில் நாம் ஏற்படுத்தும் மகிழ்ச்சியான மாற்றமே உண்மையான சாதனை. (இதையே நாசுக்கா சொல்லணும்னா...
    நான் ஒரு வெட்டி ஆபிஸர்.)
