quote: “கல்லூரி நாட்களில் நம் வகுப்பில் அனைவருடனும் நான் அதிகமாகப் பழகவில்லை. கடந்தவை கடந்தவையாகவே இருக்கட்டும்!
  இப்போது மீண்டும் ஒரு புதிய தொடக்கத்தை உருவாக்குவோம். பழைய வகுப்புத் தோழர்களைப் புதிய நண்பர்களாக மாற்றுவதற்கு
  ஒருபோதும் காலம் கடந்துவிடுவதில்லை.”
