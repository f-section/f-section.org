  value: F என்ற குரூப்பை ஆரம்பித்து எல்லா நண்பர்களையும் இதில் உறுப்பினர்களாக அங்கம் வகிக்க செய்தது. இதில்
    எல்லோருடைய பங்களிப்பும் கொண்டு வந்து சாத்தியமாக்கியது.
panels:
- label: மறக்க முடியாத நினைவு
  value: முதலாமாண்டு மின்னியல் பாடத்தின் முதல் பருவத் தேர்வில் வகுப்பின் பாதிபேர் ஒரு மதிப்பெண்ணிற்கும்
    கீழே. பூஜ்ஜியம் வாங்கிய நண்பர் ஒருவர் அரை மதிப்பெண் வாங்கிய வரை பார்த்து “என்னை விட நீ எப்படி அதிகம்
    மதிப்பெண் பெற முடிந்தது” என வியந்து கேள்வி கேட்டது.
