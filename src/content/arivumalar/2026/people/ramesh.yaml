city: ஜாம்ஷெட்பூர், ஜார்க்கண்ட், இந்தியா
fields:
- label: பணி
  value: டாடா ஸ்டீல் நிறுவனத்தில் ‘சின்டர் பிளான்ட்ஸ் மற்றும் டி.ஆர்.ஐ’ (Sinter Plants & DRI) பிரிவின்
    தலைவர்
- label: பொழுதுபோக்கு
  value: உடற்பயிற்சிக் கூடம் செல்வது, பயணம் செய்யும்போது திரைப்படங்கள் பார்ப்பது (ஒவ்வொரு வார இறுதியிலும்
    சுமார் 700 கி.மீ பயணம் செய்கிறேன்)
- label: இணையர்
  value: ஆர். பீமா
- label: திருமண நாள்
  value: 14.06.2006
- label: பிள்ளைகள்
  value: ஆர். யோகிதா (16 வயது), ஆர். விபிலன் (12 வயது)
- label: தன்னார்வப் பணி
  value: நிறுவனத்தின் CSR திட்டங்கள் மூலம் மட்டுமே; நல்வாழ்வு அதிகாரியாகவும், தொழில்சார் மற்றும் தொழில்துறை
    சுகாதார உயர்மட்டத் துணைக்குழுவின் தலைவராகவும் செயல்படுகிறேன்.
- label: முப்பது ஆண்டுச் சாதனை
  value: டாடா ஸ்டீல் நிறுவனத்தில் நல்ல பெயருடன் சிறப்பான ஒரு நிலையை அடைந்தது.
panels:
- label: மறக்க முடியாத நினைவு
  value: விடுதியில் நண்பர்களுடன் அரட்டை அடித்தது, டிவி பார்த்தது, மொட்டைமாடி, கேண்டீன், முதலாம் ஆண்டு
    ராகிங், கலைக்காக ஒரு மாணவிக்கு கடிதம் எழுதியது, திருச்சியில் ரஜினி படம் பார்த்தது, ரஜினி பேட்டியின்
    போது ஆரத்தி எடுத்தது மற்றும் ஃபெஸ்டெம்பர் நாடகம். கிச்சாவின் நோட்ஸை மட்டுமே படித்துவிட்டு அவனை விட
    அதிக மதிப்பெண் பெற்றதும், இனிமேல் நோட்ஸ் தரமாட்டேன் என்று கிச்சா கூறியதும்.
