photo_now:
  key: public/arivumalar/2026/img/family-ramesh-1.webp
  source: assets/family/ramesh-1.jpeg
  alt: ரமேஷ் — இன்று
quote: “கல்லூரியில் இருந்த ‘ஆக்டகன்’ (Octagon) போன்ற வசதிகளை இன்னும் சிறப்பாகப் பயன்படுத்தியிருக்கலாம்.
  எஃப்-செக்‌ஷன் நண்பர்கள் குழுவில் அரசியல் விவாதங்களைத் தவிர்க்க வேண்டும்; அது நண்பர்களிடையே தேவையற்ற
  மனக்கசப்புகளை உருவாக்குகிறது.”
