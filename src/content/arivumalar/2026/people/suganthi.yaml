quote: “அன்பான வகுப்புத் தோழர்களே, நீங்கள் அனைவரும் நலமாக இருப்பீர்கள் என நம்புகிறேன். RECT அட்மின் பிளாக்கில்
  (Admin Block) நெஞ்சில் கனவுகளுடன் நாம் நுழைந்த முதல் நாள்; இரண்டு மாதங்களில் முடித்த ஒரு செமஸ்டர் —
  என்றும் நிலைத்திருக்கும் நினைவுகள் இவை. உங்களுக்கு அமைதியும் நல்ல ஆரோக்கியமும் மகிழ்ச்சியும் கிடைக்கப்
  பிரார்த்திக்கிறேன்; அன்புடன், சுகந்தி எட்வின்.”
