city: மதுரை
fields:
- label: பணி
  value: நான் பொதுத்துறை வங்கியில் பணிபுரிகிறேன்.
- label: இணையர்
  value: ஏ. எட்வின் ஆரோக்கியம்
- label: திருமண நாள்
  value: 22.11.2001
- label: பிள்ளைகள்
  value: இ. ரினா ஷெரில் வெரோனிகா — மதுரை TCE-யில் பி.டெக் முடித்துவிட்டு தற்போது தனியார் துறையில் பணிபுரிகிறார்.
- label: முப்பது ஆண்டுச் சாதனை
  value: சுயநம்பிக்கையையும், வேலைக்கும் தனிப்பட்ட வாழ்க்கைக்கும் இடையிலான சமநிலையையும் (work-life balance)
    சரியாகப் பராமரிப்பதே எனது மிகப்பெரிய சாதனையாகக் கருதுகிறேன்.
panels:
- label: மறக்க முடியாத நினைவு
  value: இறுதி ஆண்டு புராஜெக்ட்டில் என்னைச் சேர்த்துக் கொண்ட குமரவேல் மற்றும் மோகன் சுகுமார் ஆகியோருக்கு
    இந்த நல்வாய்ப்பில் மனமார்ந்த நன்றியைத் தெரிவித்துக்கொள்கிறேன். அவர்களின் ஆதரவு இல்லை என்றால் நான்
    என் பட்டப்படிப்பை முடித்திருக்க முடியாது; அது நான் இன்றும் போற்றும் ஒரு நினைவாக உள்ளது.
