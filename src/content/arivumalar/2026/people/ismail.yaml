slug: ismail
name:
  ta: இஸ்மாயில்
  en: Ismail
printed_name: முகமது இஸ்மாயில்
order: 14
city: சென்னை, இந்தியா
fields:
- label: பணி
  value: ப்ராடக்ட் ஓனர் (Product Owner), முதுநிலை ஆலோசகர் (Senior Consultant)
- label: பொழுதுபோக்கு
  value: நடப்பு நிகழ்வுகளை அறிந்துகொள்வது
- label: இணையர்
  value: அமினா
- label: திருமண நாள்
  value: 18.05.2003
- label: பிள்ளைகள்
  value: மகள் ஃபஹீமா (எம்.பி.பி.எஸ் மூன்றாம் ஆண்டு), மகன் மர்சூக் (11 ஆம் வகுப்பு)
- label: தன்னார்வப் பணி
  value: பெரிதாக ஏதுமில்லை; குடும்ப நண்பர்கள் மூலம் ‘ஜகாத்’ (Zakath) தொண்டு வழியே, பெரும்பாலும் கல்லூரி
    கட்டணம் செலுத்த உதவுகிறேன்.
- label: முப்பது ஆண்டுச் சாதனை
  value: கடன்களைப் பற்றி சிந்திக்காத வாழ்க்கை; மீண்டும் இந்தியா திரும்பி வந்து செட்டிலாக முடிந்தது.
panels:
- label: மறக்க முடியாத நினைவு
  value: நிறைய உள்ளன; ஆனால், நவம்பர் 6-ஆம் தேதி கல்லூரியில் சேர்ந்ததும் விடுதி இல்லை என்று அறிந்தபோது
    அடைந்த அதிர்ச்சி மறக்க முடியாதது. ஒரு பெருமைமிகு RECT மாணவனாகச் சேர்ந்த பிறகு பலருடன் பேருந்தில் நெல்லைக்குச்
    சென்ற முதல் பயணம். கல்லூரியின் கடைசி நாளான மே 22 (என நினைக்கிறேன்), நெல்லை எக்ஸ்பிரஸ் ரயிலுக்காக மாலை
    4 மணி முதல் நள்ளிரவு 12 மணி வரை திருச்சி ரயில் நிலையத்தில் காத்திருந்து, பல RECT நண்பர்களை பல்வேறு
    ரயில்களில் வழியனுப்பி வைத்தது.
