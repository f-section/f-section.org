quote: “வாழ்க்கையை அதன் போக்கிலேயே ஏற்றுக்கொள்வோம்; முடிந்தால் 60 வயதிற்கு மேற்பட்டவர்கள் அல்லது 6 வயதிற்கு
  உட்பட்ட குழந்தைகளுடன் நேரம் செலவிடுங்கள்; மதங்களைப் பற்றி ஆராய்ந்து படியுங்கள்.”
