city: ஸ்ரீபெரும்புதூர்
fields:
- label: பணி
  value: சொந்தத் தொழில் — V2H இன்ஜினியரிங் (V2H Engineering)
- label: பொழுதுபோக்கு
  value: பயணம் செய்வது
- label: இணையர்
  value: விந்தியா டி.
- label: பிள்ளைகள்
  value: ஹர்ஷினி வி.
- label: தன்னார்வப் பணி
  value: எங்கள் சமூகக் குழுவுடன் சேர்ந்து நற்பணிகள் செய்கிறேன்.
- label: முப்பது ஆண்டுச் சாதனை
  value: V2H இன்ஜினியரிங் என்ற ஒரு உற்பத்தித் தொழிற்சாலையை நிறுவி அதில் திறமையானவர்களுக்கு வேலைவாய்ப்புகளை
    வழங்கியதில் நான் பெருமைப்படுகிறேன். மேலும், இந்தியப் பாதுகாப்புத் துறை மற்றும் NLC திட்டங்களுக்குப்
    பங்களித்து, நம் தேசத்தின் தொழில்துறை வளர்ச்சிக்கு ஆதரவளிப்பதும் மிகுந்த மனநிறைவையும் ஒரு பெரிய சாதனையாகவும்
    கருதுகிறேன்.
panels:
- label: மறக்க முடியாத நினைவு
  value: RECT-யில் கழித்த 4 ஆண்டுகளுமே ஒவ்வொரு நாளும் சிறப்புதான் — முதலாம் ஆண்டு கொண்டாட்டத்தை ஏற்பாடு
    செய்தது மற்றும் முக்கொம்பு சென்றது.
