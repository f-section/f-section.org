slug: saravanan
name:
  ta: சரவணன்
  en: Saravanan
printed_name: சரவணன்
order: 5
city: ஏபெக்‌ஷ், வட கேரொலைனா — அமெரிக்கா
fields:
- label: பணி
  value: மெட் லைஃப் என்ற தனியார் நிறுவனத்தில் மென்பொறியாளர்
- label: பொழுதுபோக்கு
  value: தமிழ் செயற்கை நுண்ணறிவு மென்பொருள் கட்டமைப்பு
- label: இணையர்
  value: அருணா சரவணன் — அரசுப் பள்ளி ஆசிரியை
- label: திருமண நாள்
  value: 15.11.2002
- label: பிள்ளைகள்
  value: 'சித்தார்த், 22 வயது — மின்பொறியியல் இறுதி ஆண்டு

    கௌதம், 17 வயது — 12 ஆம் வகுப்பு'
- label: தன்னார்வப் பணி
  value: தமிழ்ப் பள்ளி செயல்பாட்டாளர் · சிலம்ப பயிற்றுநர் · பன்னாட்டுக் கல்வி அறக்கட்டளையின் தலைவர் (ief-global.org)
- label: முப்பது ஆண்டுச் சாதனை
  value: இளங்கலை தமிழியல் பட்டம் (B.A. in Tamilology) 50 வயதில் படித்து முடித்தது. பத்து ஆண்டுகளுக்கும்
    மேலாக அமெரிக்காவில் பிறந்து வளரும் மாணவர்களுக்குத் தமிழ் மற்றும் சிலம்பம் கற்றுத் தருவது.
panels:
- label: மறக்க முடியாத நினைவு
  value: இரண்டாம் ஆண்டு கோடை விடுமுறை முடிந்து கல்லூரி திரும்ப வேண்டிய நாளில், ஊரில் ஒரு சிறு அறுவை சிகிச்சை
    செய்ய வேண்டி தாமதமாக கல்லூரிக்கு வந்தேன். அப்பொழுது F-Section நண்பர்கள் எனக்கும் Sapphire விடுதியில்
    முன்னவே அறை பதிவு செய்து எனது உடைமைகளையும் கொண்டு வந்து வைத்து விட்டார்கள். நான்கு ஆண்டுகளும் நண்பர்கள்
    அனைவரும் ஒரே விடுதியில் தங்குமாறு பார்த்துக் கொண்டது ஒரு சிறப்பு.
