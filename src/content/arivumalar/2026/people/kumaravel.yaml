quote: “30 ஆண்டுகள் கடந்தும் நம் நட்பு தொடர்வதே மிகப் பெரிய மகிழ்ச்சி. வாழ்க்கை எங்கு கொண்டு சென்றாலும்,
  அந்தக் கல்லூரி நாட்களும் நண்பர்களும் என்றும் மறக்க முடியாதவை. என் வாழ்க்கைக்கான வலுவான அடித்தளம் கல்லூரி
  வாழ்க்கை கொடுத்த அனுபவங்களில் தான் உருவானது.”
