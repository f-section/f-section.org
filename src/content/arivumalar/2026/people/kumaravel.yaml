- label: இணையர்
  value: கவிதா
- label: திருமண நாள்
  value: மே 24
- label: பிள்ளைகள்
  value: Tranthini — Loughborough பல்கலைக்கழகத்தில் (Economics & Finance) சேர்ந்திருக்கிறார். இங்கிலாந்தின்
    முன்னணி பேட்மிண்டன் வீராங்கனைகளில் ஒருவராக இருக்கிறார்
- label: தன்னார்வப் பணி
  value: தீவிரமான தன்னார்வப் பணிகளில் தற்போது ஈடுபடவில்லை. ஆனால் Manavata.org அமைப்பின் சில முயற்சிகளுக்கு
    ஆதரவு வழங்கி வருகிறேன். என் கிராமத்தின் கல்வி மற்றும் சமூக முன்னேற்றத்திற்கும் என்னால் முடிந்த உதவிகளை
    செய்து வருகிறேன்.
- label: முப்பது ஆண்டுச் சாதனை
  value: நாங்கள் உருவாக்கிய நிறுவனம் மூலமாக பலருக்கு வேலை வாய்ப்புகளை உருவாக்கியதும், எங்களுடன் பயணித்த
    பலரின் வாழ்க்கையில் ஒரு நல்ல தாக்கத்தை ஏற்படுத்தியிருப்பதும் என் சாதனைகளாகக் கருதுகிறேன். அதேபோல்,
    என் மகளின் பேட்மிண்டன் பயணத்தில் துணையாக அவளின் கனவுகளை நனவாக்க முயற்சி செய்து கொண்டிருப்பது மிகுந்த
    மகிழ்ச்சியையும் மனநிறைவையும் அளிக்கிறது.
panels:
- label: மறக்க முடியாத நினைவு
  value: கல்லூரி வாழ்க்கையில் மறக்க முடியாத சம்பவம் இறுதியாண்டு Production Engineering வகுப்புத் தேர்தல்.
    அரசியலில் எனக்கு எந்த அனுபவமும் இல்லை. ஆனால் சில சூழ்நிலைகளால் போட்டியிட வேண்டிய நிலை ஏற்பட்டது. நண்பர்களின்
    ஆதரவைப் பெறவும், திட்டமிட்டு செயல்படவும் பல தூக்கமில்லா இரவுகளை கழித்தேன். அந்த அனுபவம் எனக்கு ஒரு
    பெரிய பாடத்தை கற்றுக்கொடுத்தது. வெற்றியோ தோல்வியோ முக்கியமல்ல; நம்பிக்கையுடனும் கடின உழைப்புடனும்
    செயல்படுவதுதான் முக்கியம் என்பதை உணர்ந்தேன். மேலும் மனிதாபிமானமும் நல்ல மனமும் மனிதர்களிடம் இன்னும்
    இருக்கிறது என்பதையும் அந்த அனுபவம் எனக்குக் காட்டியது.
