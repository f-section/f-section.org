    ஷார்விகா'
- label: முப்பது ஆண்டுச் சாதனை
  value: நிச்சயமாக வாழ்க்கையில் சில மைலகற்களை எட்டியிருக்கிறேன் என்று உணர்கிறேன்... ஆனால் அது எது என்று
    தெளிவாகப் பட்டியலிட முடியவில்லை. இதுதான் என்று குறிப்பிட்டுச் சொல்லும் அளவுக்கு பிரம்மாண்டமான சாதனை
    ஏதுமில்லை.
panels:
- label: மறக்க முடியாத நினைவு
  value: சில கலைநிகழ்ச்சிகளில் கலந்துகொண்டது, டயமண்ட் விடுதியில் சமைத்துச் சாப்பிட்டது (குறிப்பாக பீஃப்),
    நான்கு வருடங்களும் தினமும் காலையில் பிரெட் மட்டுமே சாப்பிட்டாலும் அதற்காக ஒருபோதும் வருத்தப்படாதது
    - இதை இப்போதும் என் குழந்தைகளிடம் பெருமையாகப் பகிர்ந்துகொள்வேன். துவாக்குடி தியேட்டரில் பார்த்த நைட்
    ஷோக்கள்... என் அறையும், பானைக்குள் ஸ்பீக்கர் வைத்து டேப் ரெக்கார்டரில் இளையராஜாவின் இசையோடு தூங்கிய
    அந்த இரவுகள்.
