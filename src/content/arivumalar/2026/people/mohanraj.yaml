quote: “கல்லூரி நாட்களில் கலைநிகழ்ச்சிகளில் இன்னும் அதிகமாகக் கலந்துகொண்டிருக்கலாம்... இன்னும் கொஞ்சம்
  சிறப்பான தாக்கத்தை ஏற்படுத்தியிருக்கலாம்... ஏதோ ஒரு வெற்றிடம் இருப்பது போன்ற உணர்வு இப்போதும் உள்ளது.”
