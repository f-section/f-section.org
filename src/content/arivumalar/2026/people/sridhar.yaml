fields:
- label: பணி
  value: டெலிவரி மேனேஜ்மென்ட் இயக்குநர் (Director Delivery Management)
- label: பொழுதுபோக்கு
  value: குடும்பத்தினர் மற்றும் நண்பர்களுடன் நேரத்தைச் செலவிடுவது
- label: இணையர்
  value: புவனேஸ்வரி எஸ்.
- label: திருமண நாள்
  value: ஆகஸ்ட் 18
- label: பிள்ளைகள்
  value: 'சுபஸ்ரீ துர்கா — எம்.பி.பி.எஸ் இறுதியாண்டு

    ஜெயஸ்ரீ — பி.இ மூன்றாம் ஆண்டு'
- label: தன்னார்வப் பணி
  value: பி.எம்.ஐ (PMI) சென்னை பிரிவில் ஏ.வி.பி — புரோகிராம்ஸ் (AVP - Programs)
- label: முப்பது ஆண்டுச் சாதனை
  value: இதுவரை வாழ்க்கையை வெற்றிகரமாக நடத்திச் செல்வதே ஒரு சாதனைதான்.
panels:
- label: மறக்க முடியாத நினைவு
  value: ‘தேவர் மகன்’ திரைப்படம் வெளியானபோது, அவரைப் போலவே வேடமிட்டு உணவுக்காக மெஸ்ஸுக்குச் சென்றது. மேலும்,
    ரஜினியின் ஒரு படத்திற்கு ஈவினிங் ஷோ சென்று, அது கிடைக்காமல் கடைசியில் நைட் ஷோ பார்த்துவிட்டு காலையில்
    நண்பர்களுடன் திரும்பி வந்தது.
