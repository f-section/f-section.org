  alt: மோகன் சுகுமார் — இன்று
quote: “கல்லூரி முடிந்த பிறகு, பழைய நண்பர்களைச் சந்திப்பது இதுபோன்ற ஒன்றுகூடல்களின் போது மட்டுமே நிகழ்கிறது;
  ஆனால் நண்பர்கள் அதையும் தவிர்க்கும்போது மனதுக்கு வலிக்கிறது. நண்பர்களே, நாம் 50 வயதைக் கடந்தவர்கள்;
  எதையும் கையாளவும் கடந்து செல்லவும் போதுமான முதிர்ச்சி அடைந்துள்ளோம்.”
