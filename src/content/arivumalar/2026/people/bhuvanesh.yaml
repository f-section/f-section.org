slug: bhuvanesh
name:
  ta: புவனேஷ்
  en: Bhuvanesh
printed_name: புவனேஷ் சுப்ரமணியன்
order: 11
city: துபாய், அமீரகம்
fields:
- label: பணி
  value: அபுதாபியில் உள்ள ADPORTS நிறுவனத்தில் முதுநிலை ‘புரோகிராம் கன்ட்ரோல்ஸ் மேலாளராக’ பணிபுரிகிறேன்.
- label: பொழுதுபோக்கு
  value: மிதிவண்டி ஓட்டுதல்
- label: இணையர்
  value: ராஜம் புவனேஷ்
- label: திருமண நாள்
  value: 08.09.2002
- label: பிள்ளைகள்
  value: 'மகன் டாக்டர் சங்கர் புவனேஷ் — பிரிட்டனின் NHS பிளாக்பூல் விக்டோரியா மருத்துவமனையில் FY1 மருத்துவராகப்
    பணிபுரிகிறார்.

    மகள் உதயா புவனேஷ் — பாஸ்டன் NEU-வில் கணினி அறிவியல் (CSE) இரண்டாம் ஆண்டு படிக்கிறார்.'
- label: முப்பது ஆண்டுச் சாதனை
  value: இன்னும் உயிரோட இருக்கேன்!
panels:
- label: மறக்க முடியாத நினைவு
  value: ஐயகோக்கா (Iacocca) புத்தகத்தை ஆங்கிலத்தில் படிக்க நான் பலமுறை முயற்சி செய்தேன். ஆங்கிலத் தேர்வில்
    ஏற்பட்ட அந்த அனுபவம் என் வாழ்க்கையில் மறக்க முடியாத ஒன்றாக உள்ளது.
