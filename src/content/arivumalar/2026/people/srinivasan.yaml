slug: srinivasan
name:
  ta: சீனிவாசன்
  en: Srinivasan
printed_name: ஆர். சீனிவாசன்
order: 6
city: சென்னை
fields:
- label: பணி
  value: கடந்த 23 ஆண்டுகளாக இன்ஃபோசிஸ் நிறுவனத்தில் பணிபுரிகிறேன்; 30 ஆண்டுகளை நிறைவு செய்வேன் என நம்புகிறேன்.
- label: பொழுதுபோக்கு
  value: நீச்சல், நடைப்பயிற்சி மற்றும் பள்ளி, கல்லூரி, அலுவலக, பால்ய கால நண்பர்களுடன் நேரத்தைச் செலவிடுவது
- label: இணையர்
  value: எஸ். மகேஸ்வரி
- label: திருமண நாள்
  value: 12.04.2007
- label: பிள்ளைகள்
  value: 'வேதிகா — எம்.பி.பி.எஸ் முதலாம் ஆண்டு

    தீரேன் — 10 ஆம் வகுப்பு'
- label: தன்னார்வப் பணி
  value: கடந்த 28 ஆண்டுகளாக சுமார் 40 முதல் 45 முறை இரத்த தானம் செய்துள்ளேன்.
- label: முப்பது ஆண்டுச் சாதனை
  value: டென்னிஸ், ஹேண்ட்பால், நீச்சல், சைக்கிள் ஓட்டுதல் போன்ற விளையாட்டுகளில் தொடர்ந்து ஈடுபடுவது ·
    மாதத் தவணை (EMI), வங்கிக் கடன்கள் மற்றும் கிரெடிட் கார்டுகள் ஏதுமில்லாத வாழ்க்கை · மாதத்திற்கு ஒரு
    முறையாவது பழைய நண்பர்களில் ஒருவரையாவது தனிப்பட்ட முறையிலோ அல்லது குழுவாகவோ சந்திப்பது · இரவில் சீக்கிரம்
    உறங்கி, அதிகாலை 4.30 மணிக்கே விழித்தெழுவது
panels:
- label: மறக்க முடியாத நினைவு
  value: திருநெல்வேலி அரசுப் பொறியியல் கல்லூரியில் (GCE) நடந்த TIES விளையாட்டுப் போட்டியில் மும்முறைத்
    தாண்டுதலில் (Triple jump) பதக்கம் வென்றது மற்றும் அந்தச் செய்தி ‘மாலைமலர்’ திருநெல்வேலி பதிப்பில்
    வெளியானது.
