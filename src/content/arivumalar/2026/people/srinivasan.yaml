quote: “நமது இந்தப் பயணம் அடுத்த 20 முதல் 30 ஆண்டுகளில் நிறைவடைந்து விடும்; எனவே, இரண்டு ஆண்டுகளுக்கு
  ஒரு முறையாவது நாம் சந்திக்க முயற்சி செய்வோம்.”
