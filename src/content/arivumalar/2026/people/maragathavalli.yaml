slug: maragathavalli
name:
  ta: மரகதவல்லி
printed_name: மரகதவல்லி
order: 13
city: பெங்களூரு — கர்நாடகா, இந்தியா
fields:
- label: பணி
  value: ஒரு வேளாண் உற்பத்தி நிறுவனத்தில் மேலாண் பணி · மலையேற்றப்பயிற்சி
- label: பொழுதுபோக்கு
  value: எழுத்து, வாசிப்பு, பயணம்
- label: பிள்ளைகள்
  value: 'விஸ்வநாதன் — பட்டப்படிப்பு (கணிதம்) முடித்து பணியிலிருக்கிறார்

    அஞ்சலி (மகள்) — பட்டப்படிப்பு (சமூகவியல்) முடித்து பணிபுரிகிறார்'
- label: தன்னார்வப் பணி
  value: இந்திய மொழிகளில் ஆர்வத்தை ஊக்குவிக்க — மன்றம். இந்திய சிந்தனைகளின் அடிப்படையில், சமூக ஒற்றைமைக்காக
    ஆழ்ந்த உரையாடல்கள், பட்டறைகள்.
- label: முப்பது ஆண்டுச் சாதனை
  value: அலுவல் / குடும்பம் சாராத அடையாளத்தை ஏற்படுத்திக்கொள்ளும் முயற்சி. அது இன்னும் ஒரு முயற்சிதான்.
    அந்தத் தேடலிலே நிலைத்திருப்பதுதான் சாதனை.
panels:
- label: மறக்க முடியாத நினைவு
  value: பலப்பல நினைவுகள். F செக்‌ஷனில் சேர்ததால் சீனியர்களிடம் அத்தனை பயமில்லை. நாங்கள் கல்லூரி தொடங்கியபோது
    அவர்களின் ராகிங் ஆர்வம் ஓய்ந்திருந்தது. அதனாலோ என்னவோ, யாரோ கேட்டார்களென்று சேர்ந்த சில நாட்களலேயே,
    A3 கூடத்தில் “இஞ்சி இடுப்பழகி” பாடலை ஆங்கிலத்தில் பாடினேன். எனக்கும் பாட்டுக்கும் இருக்கும் தூரத்தை
    அறியாத நாட்கள்.
