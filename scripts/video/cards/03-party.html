<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
  .t1 { font-size: 190px; color: var(--ink); }
  .t1 .amp { color: var(--ink-red); }
  .t2 { font-size: 150px; color: var(--ink); margin-top: 18px; }
  .t2 .flav { color: var(--ink-red); position: relative; }
  .t2 .flav::after { content: ""; position: absolute; left: 4px; right: 4px; bottom: -10px; height: 10px; border-radius: 6px; background: var(--marigold); opacity: .8; }
  .emoji { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; font-size: 120px; margin-top: 52px; letter-spacing: 24px; padding-left: 24px; }
</style></head>
<body>
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="stage">
    <div class="hand t1">The raw <span class="amp">&amp;</span> real party…</div>
    <div class="hand t2">with authentic <span class="flav">flavours</span></div>
    <div class="emoji">😜🤣</div>
  </div>
</body></html>
