<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
  .title { font-size: 250px; color: var(--ink); margin-top: 18px; letter-spacing: -2px; }
  .title .yr { color: var(--ink-red); }
  .sub { font-size: 92px; color: var(--sepia); margin-top: 6px; }
  .lines { margin-top: 44px; font-size: 44px; line-height: 1.75; }
  .lines em { font-family: "Caveat", cursive; font-weight: 700; font-style: normal; font-size: 58px; line-height: 0; color: var(--ink-red); }
  .when { margin-top: 46px; font-size: 36px; font-weight: 600; color: var(--ink); }
  .when span { color: var(--sepia); font-weight: 400; }
</style></head>
<body>
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="stage">
    <div class="overline">REC Trichy · Class of 1996</div>
    <div class="hand title">Reunion <span class="yr">2026</span></div>
    <div class="hand sub">30 years on</div>
    <div class="rule" style="margin-top:34px"></div>
    <div class="lines">
      Different paths, <em>one journey</em>.<br>
      Timeless bonds, <em>endless memories</em>.<br>
      Let’s reconnect, rejoice and relive!
    </div>
    <div class="when">2 – 3 October 2026 <span>·</span> NIT Tiruchirappalli</div>
  </div>
</body></html>
